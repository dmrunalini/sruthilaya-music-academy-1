<div class="signup">
  <h2>Sign up</h2>
  <form (ngSubmit)="onSubmit()" [formGroup]="signupForm">
    <label>Name</label>
  <input formControlName="name" />
  <div class="error" *ngIf="signupForm.get('name')?.touched && signupForm.get('name')?.invalid">Name is required</div>

    <label>Email</label>
  <input formControlName="email" />
  <div class="error" *ngIf="signupForm.get('email')?.touched && signupForm.get('email')?.invalid">Enter a valid email</div>

    <label>Password</label>
    <input type="password" formControlName="password" />
  <div class="error" *ngIf="signupForm.get('password')?.touched && signupForm.get('password')?.errors?.minlength">Password must be at least 6 characters</div>

    <label>Phone</label>
    <div class="phone-row">
      <select formControlName="countryCode">
        <option value="+91">+91 (IN)</option>
        <option value="+1">+1 (US)</option>
        <option value="+44">+44 (UK)</option>
        <option value="+61">+61 (AU)</option>
      </select>
      <input formControlName="phone" />
    </div>
    <div class="error" *ngIf="signupForm.get('phone')?.touched && signupForm.get('phone')?.invalid">Enter a valid phone number</div>
    <label>Age</label>
  <input type="number" formControlName="age" />
  <div class="error" *ngIf="signupForm.get('age')?.touched && signupForm.get('age')?.invalid">Enter a valid age (5-120)</div>

    <label>Gender</label>
    <select formControlName="gender">
      <option value="">Select</option>
      <option value="male">Male</option>
      <option value="female">Female</option>
      <option value="other">Other</option>
    </select>

    <label>Role</label>
    <select formControlName="role">
      <option value="student">Student</option>
      <option value="teacher">Teacher</option>
    </select>

    <label>Your Timezone</label>
    <select formControlName="timezone">
      <option *ngFor="let tz of availableTimezones" [value]="tz.code">
        {{ tz.name }} ({{ tz.code }})
      </option>
    </select>
    <div class="error" *ngIf="signupForm.get('timezone')?.touched && signupForm.get('timezone')?.invalid">Please select your timezone</div>

    <label>Teams link (optional)</label>
  <input formControlName="teamsLink" />
  <div class="error" *ngIf="signupForm.get('teamsLink')?.touched && signupForm.get('teamsLink')?.invalid">Enter a valid URL for Teams</div>

    <div *ngIf="errorMessage" class="error">{{ errorMessage }}</div>

    <button type="submit" [disabled]="isSubmitting">Sign up</button>
  </form>

  <p>Already have an account? <a routerLink="/login">Login</a></p>
</div>
